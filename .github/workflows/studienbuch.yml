name: Studienbuch
on:
  pull_request:
    paths:
      - 'docs/lehrbuch/studienbuch/**'
      - 'docs/lehrbuch/gesamtausgabe/**'
      - 'docs/reviews/v922-csv/**'
      - 'docs/ARGESIM_*'
      - 'docs/evidence/cp2-operators.json'
      - 'scripts/build_studienbuch*.py'
      - 'scripts/pruefe_studienbuch_befunde.py'
      - 'scripts/cp2_accuracy/**'
      - 'argesim_benchmarks/experiments/cp2_*.py'
      - 'tests/test_studienbuch_befunde.py'
      - 'tests/test_cp2_accuracy.py'
      - '.github/workflows/studienbuch.yml'
  push:
    branches: [main]
    tags: ['book-v*']
    paths:
      - 'docs/lehrbuch/studienbuch/**'
      - 'docs/lehrbuch/gesamtausgabe/**'
      - 'docs/reviews/v922-csv/**'
      - 'docs/ARGESIM_*'
      - 'docs/evidence/cp2-operators.json'
      - 'scripts/build_studienbuch*.py'
      - 'scripts/pruefe_studienbuch_befunde.py'
      - 'scripts/cp2_accuracy/**'
      - 'argesim_benchmarks/experiments/cp2_*.py'
      - 'tests/test_studienbuch_befunde.py'
      - 'tests/test_cp2_accuracy.py'
      - '.github/workflows/studienbuch.yml'
  workflow_dispatch:
    inputs:
      release_check:
        description: Require all automated finding checks to pass
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_check:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the PDF inspection dependency
        run: python -m pip install pypdf==6.21.4
      - name: Test the finding checks
        run: python -m unittest tests.test_studienbuch_befunde -v
      - name: Verify the edition and check findings
        id: findings
        shell: bash
        env:
          RELEASE_CHECK: ${{ inputs.release_check || startsWith(github.ref, 'refs/tags/book-v') }}
        run: |
          args=()
          if [[ "$RELEASE_CHECK" == true ]]; then args+=(--strict); fi
          expected_commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          python scripts/pruefe_studienbuch_befunde.py \
            --expected-commit "$expected_commit" \
            --output "$RUNNER_TEMP/ARGESIM_Lehrbuchbefunde.json" "${args[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Attach the finding report
        if: ${{ !cancelled() && steps.findings.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARGESIM-Lehrbuchbefunde
          path: ${{ runner.temp }}/ARGESIM_Lehrbuchbefunde.json
          if-no-files-found: warn
      - name: Rebuild with the Debian 13 typesetting toolchain
        run: |
          docker run --rm -i --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work debian:trixie-slim sh -se <<'BUILD'
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update
          apt-get install -y --no-install-recommends python3-venv ca-certificates pandoc texlive-xetex texlive-latex-extra texlive-lang-german texlive-fonts-recommended fonts-noto-core fonts-noto-extra fonts-dejavu-core fonts-lmodern
          python3 -m venv /tmp/python
          /tmp/python/bin/pip -q install PyMuPDF==1.26.6
          /tmp/python/bin/python scripts/build_studienbuch.py --verify-pdf
          /tmp/python/bin/python scripts/build_studienbuch.py --output-dir /tmp/studienbuch
          BUILD
      - name: Assemble all published experiments and field data
        run: python scripts/build_studienbuch.py --full-lab "$RUNNER_TEMP/ARGESIM_Rechenlabor_v9_22.zip"
      - name: Run the shipped lab outside the repository
        run: |
          lab="$(mktemp -d "$RUNNER_TEMP/argesim-lab.XXXXXX")"
          python -I -B -m zipfile -e "$RUNNER_TEMP/ARGESIM_Rechenlabor_v9_22.zip" "$lab"
          cd "$lab"
          env -u PYTHONPATH -u PYTHONHOME python -I -B pruefen.py
      - name: Attach the complete offline lab
        uses: actions/upload-artifact@v4
        with:
          name: ARGESIM-Rechenlabor-v9.22
          path: ${{ runner.temp }}/ARGESIM_Rechenlabor_v9_22.zip
          compression-level: 0
          if-no-files-found: error
      - name: Attach the verified repository edition
        uses: actions/upload-artifact@v4
        with:
          name: ARGESIM-Studienbuch
          path: |
            docs/ARGESIM_SOLVER_STUDY.pdf
            docs/ARGESIM_Bachelor_Rechenlabor.zip
            docs/ARGESIM_Operatoren_Vergleichsstudie.zip
            docs/ARGESIM_Buchstand.json
          if-no-files-found: error

  operators:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the CPU operator runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -e '.[operators]'
      - name: Check signed velocities, operator weights and benchmark fields
        run: python -m unittest tests.test_cp2_accuracy tests.test_cp2_operators
      - name: Check the coupled-diffusion operators and LBM against the reference fields
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          lab="$RUNNER_TEMP/operatorenlabor"
          python -m zipfile -e docs/ARGESIM_Operatoren_Vergleichsstudie.zip "$lab"
          cd "$lab/rechenlabor/modaloperator"
          sha256sum --quiet -c SHA256SUMS
          python -B -m unittest -v
