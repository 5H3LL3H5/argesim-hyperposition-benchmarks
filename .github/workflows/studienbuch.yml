name: Studienbuch
on:
  pull_request:
    paths:
      - 'docs/lehrbuch/studienbuch/**'
      - 'docs/ARGESIM_*'
      - 'docs/evidence/cp2-operators.json'
      - 'scripts/build_studienbuch.py'
      - '.github/workflows/studienbuch.yml'
  push:
    branches: [main]
    paths:
      - 'docs/lehrbuch/studienbuch/**'
      - 'docs/ARGESIM_*'
      - 'docs/evidence/cp2-operators.json'
      - 'scripts/build_studienbuch.py'
      - '.github/workflows/studienbuch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published PDF, lab and their inputs
        run: python scripts/build_studienbuch.py --check
      - name: Install typesetting tools
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-german texlive-fonts-recommended fonts-noto-core fonts-noto-extra fonts-dejavu-core fonts-lmodern
          python -m pip install PyMuPDF==1.26.6
      - name: Rebuild the edition from the checkout
        run: python scripts/build_studienbuch.py --output-dir "$RUNNER_TEMP/studienbuch"
      - name: Attach the verified repository edition
        uses: actions/upload-artifact@v4
        with:
          name: ARGESIM-Studienbuch
          path: |
            docs/ARGESIM_SOLVER_STUDY.pdf
            docs/ARGESIM_Bachelor_Rechenlabor.zip
            docs/ARGESIM_Buchstand.json
          if-no-files-found: error
