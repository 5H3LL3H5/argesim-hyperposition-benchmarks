name: cp2-fno-ab-validation

on:
  pull_request:
    paths:
      - "argesim_benchmarks/experiments/cp2_fno_ab.py"
      - "argesim_benchmarks/experiments/cp2_operators.py"
      - "argesim_benchmarks/experiments/cp2_fields.py"
      - "tests/test_cp2_fno_ab.py"
      - ".github/workflows/cp2-fno-ab.yml"
  workflow_dispatch:

jobs:
  fno-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional neural operator dependencies
        run: python -m pip install ".[operators]" ruff==0.17.5
      - name: Verify optional dependency imports
        run: python -c "import torch, neuralop; from neuralop.models import FNO; print(torch.__version__)"
      - name: Lint and compile
        run: |
          ruff check argesim_benchmarks/experiments/cp2_fno_ab.py tests/test_cp2_fno_ab.py
          python -m compileall -q argesim_benchmarks/experiments/cp2_fno_ab.py tests/test_cp2_fno_ab.py
      - name: Run real neural-operator contracts (not skipped)
        run: |
          python -m unittest discover -s tests -p test_cp2_fno_ab.py -v
      - name: Smoke train A0 and B1 with independent references
        run: |
          python -m argesim_benchmarks.experiments.cp2_fno_ab --out "$RUNNER_TEMP/cp2-smoke" --epochs 2 --seeds 2027 --variants A0 B1
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert len(r['runs']) == 2; assert all(x['best_epoch'] > 0 for x in r['runs'])" "$RUNNER_TEMP/cp2-smoke/cp2-fno-ab.json"
      - name: Upload smoke evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cp2-fno-smoke
          path: ${{ runner.temp }}/cp2-smoke/cp2-fno-ab.json
          retention-days: 14

  fno-full-ab:
    needs: fno-contracts
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional neural operator dependencies
        run: python -m pip install ".[operators]"
      - name: Run all four variants with three independent seeds
        run: python -m argesim_benchmarks.experiments.cp2_fno_ab --out "$RUNNER_TEMP/cp2-full" --epochs 80 --seeds 2027 2028 2029
      - name: Check full evidence coverage
        run: |
          python -c "import json,sys; r=json.load(open(sys.argv[1])); assert len(r['runs'])==12; assert {(x['variant'],x['seed']) for x in r['runs']}=={(v,s) for v in ('A0','B1','B2','B3') for s in (2027,2028,2029)}" "$RUNNER_TEMP/cp2-full/cp2-fno-ab.json"
      - name: Upload full reproducible evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp2-fno-full-ab
          path: ${{ runner.temp }}/cp2-full/cp2-fno-ab.json
          retention-days: 30
