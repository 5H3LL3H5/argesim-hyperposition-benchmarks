name: reference-suite

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q .
      - name: Install optional IDAS backend
        if: matrix.python-version == '3.12'
        run: python -m pip install ".[dae]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Independent diode trajectory comparison
        if: matrix.python-version == '3.12'
        run: python scripts/c21_dae_reference.py
      - name: Ruff
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install ruff==0.17.5
          ruff check .
