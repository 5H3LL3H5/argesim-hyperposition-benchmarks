    <dc:title>Zählpfeile des RC-Ladekreises</dc:title>
    <dc:date>2026-11-22</dc:date>
    <dc:description>Strom i fließt von der oberen Quellklemme über den Widerstand zur oberen Kondensatorplatte. Die Bezugsspannungen weisen vom Plus- zum Minuspol. Der untere Leiter liegt auf 0 Volt.</dc:description>
